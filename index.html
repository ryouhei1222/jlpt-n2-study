তাই আগে ব্যবহারপদ্ধতি জেনে নিতে হবে।","reading":{}},{"category":"読解","stem":"【文章】\nある市では、ごみを減らすため、使い捨ての容器を使わない飲食店を紹介している。しかし、店によって対応が異なるので、客は容器を持参する前に利用方法を確認する必要がある。市は、店と客の両方が無理なく続けられる仕組みを目指している。\n\n【質問】\n市が目指していることは何ですか。","options":["すべての店の閉店","容器の販売禁止だけ","飲食店の数を減らすこと","店と客が続けやすい仕組み"],"answer":3,"explanation_ja":"最後の一文が市の目標です。","explanation_bn":"শহর কর্তৃপক্ষ এমন ব্যবস্থা চায় যা দোকান ও ক্রেতা উভয়েই চালিয়ে যেতে পারে।","reading":{}},{"category":"読解","stem":"【文章】\n私は新しい単語を覚えるとき、意味だけでなく、短い例文も一緒に書く。単語だけを何度も見るより、どの場面で使うか分かるからだ。ただし、例文が長すぎると復習に時間がかかるので、一文はなるべく短くしている。\n\n【質問】\n筆者が例文も書く理由は何ですか。","options":["使う場面を理解するため","単語帳を重くするため","文字を大きくするため","復習をやめるため"],"answer":0,"explanation_ja":"単語の使用場面を知ることが目的です。","explanation_bn":"শব্দ কোন পরিস্থিতিতে ব্যবহার হয় তা বোঝার জন্য উদাহরণ লেখেন।","reading":{}},{"category":"読解","stem":"【文章】\n私は新しい単語を覚えるとき、意味だけでなく、短い例文も一緒に書く。単語だけを何度も見るより、どの場面で使うか分かるからだ。ただし、例文が長すぎると復習に時間がかかるので、一文はなるべく短くしている。\n\n【質問】\n筆者が気をつけていることは何ですか。","options":["毎回長文を書く","意味を一切書かない","復習しない","例文を短くする"],"answer":3,"explanation_ja":"長い例文は復習の負担になると考えています。","explanation_bn":"দীর্ঘ বাক্য রিভিশনে সময় নেয়, তাই ছোট বাক্য লেখেন।","reading":{}},{"category":"読解","stem":"【文章】\n図書館では、予約した本が届いたらメールで連絡する。取り置き期間は連絡日を含めて7日間で、期間を過ぎると次の予約者に貸し出す場合がある。休館日も7日間に含まれるので注意してほしい。\n\n【質問】\n本を受け取る期間について正しいのはどれですか。","options":["休館日は数えない","連絡日を含む7日間","連絡日の翌日から14日間","期限はない"],"answer":1,"explanation_ja":"「連絡日を含めて7日間」と書かれています。","explanation_bn":"ইমেইল দেওয়ার দিনসহ মোট ৭ দিন।","reading":{}},{"category":"読解","stem":"【文章】\n図書館では、予約した本が届いたらメールで連絡する。取り置き期間は連絡日を含めて7日間で、期間を過ぎると次の予約者に貸し出す場合がある。休館日も7日間に含まれるので注意してほしい。\n\n【質問】\n期限を過ぎた本はどうなる場合がありますか。","options":["必ず購入させられる","永久に取り置かれる","次の予約者に貸し出される","自動的に家へ届く"],"answer":2,"explanation_ja":"次の予約者に回る可能性があります。","explanation_bn":"সময় পেরিয়ে গেলে পরের সংরক্ষণকারীকে বই দেওয়া হতে পারে।","reading":{}},{"category":"読解","stem":"【文章】\n在宅勤務では通勤時間がなくなる一方で、仕事と生活の切り替えが難しくなる人もいる。そのため、始業前に短い散歩をしたり、仕事専用の机を用意したりする人が増えている。大切なのは、自分に合った方法を見つけることだ。\n\n【質問】\n本文で示された在宅勤務の課題は何ですか。","options":["机が不要になること","散歩が禁止されること","仕事と生活の切り替えが難しいこと","必ず通勤時間が増えること"],"answer":2,"explanation_ja":"在宅勤務では切り替えが難しい人がいると述べています。","explanation_bn":"বাড়ি থেকে কাজ করলে কাজ ও ব্যক্তিগত জীবনের সীমা আলাদা রাখা কঠিন হতে পারে।","reading":{}},{"category":"読解","stem":"【文章】\n在宅勤務では通勤時間がなくなる一方で、仕事と生活の切り替えが難しくなる人もいる。そのため、始業前に短い散歩をしたり、仕事専用の机を用意したりする人が増えている。大切なのは、自分に合った方法を見つけることだ。\n\n【質問】\n筆者が大切だと考えることは何ですか。","options":["在宅勤務を禁止する","毎朝必ず走る","全員が同じ机を買う","自分に合う工夫をする"],"answer":3,"explanation_ja":"自分に合った方法を見つけることが重要です。","explanation_bn":"নিজের উপযোগী পদ্ধতি খুঁজে পাওয়াই গুরুত্বপূর্ণ।","reading":{}},{"category":"読解","stem":"【文章】\n地域の祭りは、以前は住民だけで運営していたが、高齢化で人手が不足するようになった。そこで今年から大学生にも協力を呼びかけた。準備の方法を一から説明する必要はあったものの、新しい企画が生まれ、参加者からも好評だった。\n\n【質問】\n大学生に協力を求めた理由は何ですか。","options":["祭りを中止するため","運営する人が足りなくなったため","大学の試験を行うため","住民を全員減らすため"],"answer":1,"explanation_ja":"高齢化による人手不足が理由です。","explanation_bn":"বয়স্ক মানুষের সংখ্যা বাড়ায় আয়োজনে লোকের অভাব হয়েছিল।","reading":{}},{"category":"読解","stem":"【文章】\n地域の祭りは、以前は住民だけで運営していたが、高齢化で人手が不足するようになった。そこで今年から大学生にも協力を呼びかけた。準備の方法を一から説明する必要はあったものの、新しい企画が生まれ、参加者からも好評だった。\n\n【質問】\n大学生の参加で起きたことは何ですか。","options":["祭りの評判が下がった","説明が不要になった","新しい企画が生まれた","準備が完全になくなった"],"answer":2,"explanation_ja":"新しい企画が生まれ、好評でした。","explanation_bn":"নতুন পরিকল্পনা এসেছে এবং অংশগ্রহণকারীরা পছন্দ করেছেন।","reading":{}},{"category":"読解","stem":"【文章】\n駅前の自転車置き場は、来月から利用料金が変わる。短時間利用はこれまでどおり無料だが、2時間を超える場合は料金が必要になる。管理者は長時間の放置を減らし、買い物客が利用しやすくすることを目的としている。\n\n【質問】\n料金が必要になるのはどんな場合ですか。","options":["すべての短時間利用","自転車を買う場合","2時間を超えて利用する場合","駅を歩いて通る場合"],"answer":2,"explanation_ja":"2時間を超える場合に料金が必要です。","explanation_bn":"২ ঘণ্টার বেশি ব্যবহার করলে ফি লাগবে।","reading":{}},{"category":"読解","stem":"【文章】\n駅前の自転車置き場は、来月から利用料金が変わる。短時間利用はこれまでどおり無料だが、2時間を超える場合は料金が必要になる。管理者は長時間の放置を減らし、買い物客が利用しやすくすることを目的としている。\n\n【質問】\n変更の主な目的は何ですか。","options":["長時間放置を減らすこと","自転車をなくすこと","買い物客を減らすこと","駅を閉めること"],"answer":0,"explanation_ja":"長時間の放置を減らすことが目的です。","explanation_bn":"দীর্ঘ সময় সাইকেল ফেলে রাখা কমানোই উদ্দেশ্য।","reading":{}},{"category":"読解","stem":"【文章】\n新入社員向け研修では、説明を聞くだけでなく、参加者同士で意見を交換する時間を設けた。最初は発言が少なかったが、少人数のグループに分けたところ、質問や提案が増えた。担当者は来年もこの方法を続けたいと考えている。\n\n【質問】\n発言を増やすために何をしましたか。","options":["少人数のグループに分けた","質問を禁止した","説明時間を倍にした","研修を中止した"],"answer":0,"explanation_ja":"グループ分けのあと、質問や提案が増えました。","explanation_bn":"ছোট দলে ভাগ করার পর প্রশ্ন ও প্রস্তাব বেড়েছে।","reading":{}},{"category":"読解","stem":"【文章】\n新入社員向け研修では、説明を聞くだけでなく、参加者同士で意見を交換する時間を設けた。最初は発言が少なかったが、少人数のグループに分けたところ、質問や提案が増えた。担当者は来年もこの方法を続けたいと考えている。\n\n【質問】\n担当者は来年どうしたいと考えていますか。","options":["研修をなくしたい","全員を別の会社に送りたい","同じ方法を続けたい","意見交換をやめたい"],"answer":2,"explanation_ja":"最後の一文に書かれています。","explanation_bn":"দায়িত্বপ্রাপ্ত ব্যক্তি আগামী বছরও এই পদ্ধতি চালাতে চান।","reading":{}},{"category":"読解","stem":"【文章】\n商品をネットで注文するとき、最も安い店だけを選ぶのは必ずしも得策ではない。送料や返品条件を確認しなければ、結果的に費用が高くなる場合がある。商品の価格だけではなく、購入後の対応も含めて比較することが大切だ。\n\n【質問】\n筆者が注意を促していることは何ですか。","options":["ネット注文を絶対にしないこと","送料だけを見て選ぶこと","商品価格以外の条件も確認すること","必ず一番安い店だけを選ぶこと"],"answer":2,"explanation_ja":"送料や返品条件も比べるべきだと述べています。","explanation_bn":"পণ্যের দাম ছাড়াও ডেলিভারি খরচ ও ফেরত নীতি দেখতে হবে।","reading":{}},{"category":"読解","stem":"【文章】\n商品をネットで注文するとき、最も安い店だけを選ぶのは必ずしも得策ではない。送料や返品条件を確認しなければ、結果的に費用が高くなる場合がある。商品の価格だけではなく、購入後の対応も含めて比較することが大切だ。\n\n【質問】\n安い店で買っても費用が高くなるのはなぜですか。","options":["必ず返品できるから","送料などがかかる場合があるから","店が近いから","商品価格が無料だから"],"answer":1,"explanation_ja":"送料などで総費用が増えることがあります。","explanation_bn":"ডেলিভারি খরচ ইত্যাদিতে মোট খরচ বেড়ে যেতে পারে।","reading":{}},{"category":"読解","stem":"【文章】\nある工場では、作業ミスを減らすため、作業が終わるたびにチェック表へ記入する制度を始めた。最初は記入の手間を心配する声もあったが、数か月後には確認漏れが減った。現在はチェック項目を整理し、さらに使いやすくしている。\n\n【質問】\n制度を始めた目的は何ですか。","options":["工場を閉鎖するため","製品を値上げするため","作業ミスを減らすため","作業時間を必ず倍にするため"],"answer":2,"explanation_ja":"最初の一文に目的があります。","explanation_bn":"কাজের ভুল কমানোর জন্য নতুন নিয়ম শুরু করা হয়েছিল।","reading":{}},{"category":"読解","stem":"【文章】\nある工場では、作業ミスを減らすため、作業が終わるたびにチェック表へ記入する制度を始めた。最初は記入の手間を心配する声もあったが、数か月後には確認漏れが減った。現在はチェック項目を整理し、さらに使いやすくしている。\n\n【質問】\n数か月後にどうなりましたか。","options":["確認漏れが減った","チェック表を廃止した","すべての作業がなくなった","確認漏れが増えた"],"answer":0,"explanation_ja":"確認漏れが減ったと書かれています。","explanation_bn":"কয়েক মাস পরে যাচাই করতে ভুল হওয়া কমেছে।","reading":{}},{"category":"読解","stem":"【文章】\n市民講座の申し込みは先着順ではなく、応募者が定員を超えた場合は抽選で決める。申込期間中であれば、いつ申し込んでも当選の可能性は同じだ。結果は来週、登録したメールアドレスに送信される。\n\n【質問】\n定員を超えた場合、参加者はどう決まりますか。","options":["抽選で決まる","全員が参加できる","年齢だけで決まる","早く申し込んだ人から決まる"],"answer":0,"explanation_ja":"先着順ではなく抽選です。","explanation_bn":"আবেদন বেশি হলে লটারির মাধ্যমে নির্বাচন হবে।","reading":{}},{"category":"読解","stem":"【文章】\n市民講座の申し込みは先着順ではなく、応募者が定員を超えた場合は抽選で決める。申込期間中であれば、いつ申し込んでも当選の可能性は同じだ。結果は来週、登録したメールアドレスに送信される。\n\n【質問】\n抽選結果はどこに届きますか。","options":["電話だけ","自宅の郵便受けだけ","市役所の掲示板だけ","登録したメールアドレス"],"answer":3,"explanation_ja":"登録メールに送信されます。","explanation_bn":"ফলাফল নিবন্ধিত ইমেইলে পাঠানো হবে।","reading":{}},{"category":"読解","stem":"【文章】\nある研究によれば、短い休憩を適切に取ることは、長時間続けて作業するより集中力を保ちやすいという。ただし、休憩の取り方には個人差があり、全員に同じ時間を勧められるわけではない。自分の作業内容に合わせて調整する必要がある。\n\n【質問】\n研究によると、短い休憩の利点は何ですか。","options":["仕事が必ずなくなる","休憩を完全になくせる","全員の作業が同じになる","集中力を保ちやすい"],"answer":3,"explanation_ja":"集中力を維持しやすいと説明されています。","explanation_bn":"ছোট বিরতি মনোযোগ ধরে রাখতে সাহায্য করতে পারে।","reading":{}},{"category":"読解","stem":"【文章】\nある研究によれば、短い休憩を適切に取ることは、長時間続けて作業するより集中力を保ちやすいという。ただし、休憩の取り方には個人差があり、全員に同じ時間を勧められるわけではない。自分の作業内容に合わせて調整する必要がある。\n\n【質問】\n休憩について筆者が述べていることは何ですか。","options":["自分に合わせて調整する必要がある","全員が同じ長さにすべき","長い休憩だけが有効","休憩は不要である"],"answer":0,"explanation_ja":"個人差があるため調整が必要です。","explanation_bn":"ব্যক্তিভেদে পার্থক্য আছে, তাই নিজের কাজ অনুযায়ী বিরতি ঠিক করতে হবে।","reading":{}},{"category":"漢字・語彙","type":"漢字読み","stem":"【　】の読み方として最もよいものを選びなさい。\n今後の方針について、上司と十分に【協議】した。","options":["きょうぎ","きょうい","こうぎ","きゅうぎ"],"answer":0,"explanation_ja":"協議（きょうぎ）は、関係者で相談して決めることです。","explanation_bn":"協議 মানে সংশ্লিষ্ট ব্যক্তিদের মধ্যে আলোচনা করে সিদ্ধান্ত নেওয়া।","reading":{}},{"category":"漢字・語彙","type":"漢字読み","stem":"【　】の読み方として最もよいものを選びなさい。\n新しい設備の【導入】が決まった。","options":["どうにゅう","とうにゅう","ど া।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"品質を保つため、製品は定期的に（　）を受ける。","options":["指示","検査","解釈","記憶"],"answer":1,"explanation_ja":"「検査を受ける」は品質などを調べてもらうことです。","explanation_bn":"「検査を受ける」 মানে গুণমান যাচাই করানো।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"この制度は来年度から（　）される予定だ。","options":["施行","作動","輸送","解消"],"answer":0,"explanation_ja":"法律や制度を実際に行い始めることを「施行する」といいます。","explanation_bn":"আইন বা নিয়ম কার্যকর করাকে 「施行する」 বলে।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"会場の人数には（　）があるため、早めに申し込んでください。","options":["規則","制限","限界","影響"],"answer":1,"explanation_ja":"入れる人数が決まっている場合は「人数に制限がある」です。","explanation_bn":"অংশগ্রহণকারীর সংখ্যার সীমা থাকলে 「制限がある」 ব্যবহার হয়।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"予想以上の注文があり、在庫が（　）した。","options":["不足","控除","不満","中断"],"answer":0,"explanation_ja":"物の数が必要な量に足りないことを「不足する」といいます。","explanation_bn":"প্রয়োজনের তুলনায় পণ্য কম হলে 「不足する」।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"調査の結果、当初の予想と（　）結果が得られた。","options":["反対","反する","異なる","逆らう"],"answer":2,"explanation_ja":"「異なる結果」は予想とは違う結果の意味です。","explanation_bn":"「異なる」 মানে ভিন্ন; পূর্বাভাস থেকে ভিন্ন ফল।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"不明な点があれば、担当者に（　）ください。","options":["お問い合わせ","お尋ね","お伺い","お答え"],"answer":1,"explanation_ja":"「担当者にお尋ねください」は丁寧に質問を促す表現です。","explanation_bn":"「お尋ねください」 বিনীতভাবে প্রশ্ন করতে বলার ভাষা।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"事故の原因を調べ、同じことが起きないよう対策を（　）。","options":["講じる","述べる","保つ","尽くす"],"answer":0,"explanation_ja":"「対策を講じる」は必要な対処方法を考えて実施することです。","explanation_bn":"「対策を講じる」 মানে প্রতিরোধমূলক ব্যবস্থা নেওয়া।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"新しい設備の導入によって、作業時間が大幅に（　）された。","options":["改造","短縮","修正","縮小"],"answer":1,"explanation_ja":"時間を短くする場合は「短縮する」を使います。","explanation_bn":"সময় কমানোকে 「短縮する」 বলে।","reading":{},"type":"文脈規定"},{"category":"漢字・語彙","stem":"この説明書には、操作方法が（　）に書かれている。","options":["詳細","細心","緻密","具体"],"answer":0,"explanation_ja":"「詳細に」は細かな点まで詳しくという意味の副詞的な表現です。","explanation_bn":"「詳細に」 মানে বিস্তারিতভাবে।","reading":{},"type":"文脈規定"},{"category":"文法","stem":"試験まで時間が少ない。（　）、毎日少しずつ復習している。","options":["それにもかかわらず","だからこそ","ところが","それどころか"],"answer":1,"explanation_ja":"「だからこそ」は前の事情を強調して理由とする表現。時間がないからこそ復習が大切、という意味です。","explanation_bn":"「だからこそ」 আগের কারণকে জোর দিয়ে বলে: সময় কম বলেই প্রতিদিন পড়ছে।","reading":{},"type":"文法形式"},{"category":"文法","stem":"彼は専門家（　）、その分野のすべてを知っているわけではない。","options":["であるからこそ","でありながら","とはいえ","にすぎず"],"answer":2,"explanation_ja":"「〜とはいえ」は「そうであっても」という譲歩を示します。「専門家とはいえ」が自然です。","explanation_bn":"「とはいえ」 মানে তা হলেও; বিশেষজ্ঞ হলেও সব জানেন না।","reading":{},"type":"文法形式"},{"category":"文法","stem":"その製品は価格が高い（　）、品質が優れているので人気がある。","options":["だけに","にもかかわらず","ばかりに","につれて"],"answer":1,"explanation_ja":"「〜にもかかわらず」は予想と反対の結果を表します。高価なのに人気がある、という対比です。","explanation_bn":"দাম বেশি হওয়া সত্ত্বেও জনপ্রিয়—এটি 「にもかかわらず」।","reading":{},"type":"文法形式"},{"category":"文法","stem":"説明を聞いた（　）、実際に操作してみると難しかった。","options":["うえで","あげく","ものの","とたん"],"answer":2,"explanation_ja":"「〜ものの」は「〜けれども」という意味。聞いたことと難しかったことを対比します。","explanation_bn":"「ものの」 মানে যদিও; ব্যাখ্যা শুনলেও ব্যবহার কঠিন ছিল।","reading":{},"type":"文法形式"},{"category":"文法","stem":"人に頼る（　）、まず自分で調べてみよう。","options":["前に","最中に","かぎり","ところで"],"answer":0,"explanation_ja":"「〜前に」は先に行うべき行動を示します。頼るより前に自分で調べます。","explanation_bn":"অন্যের সাহায্য চাওয়ার আগে নিজে খোঁজার অর্থে 「前に」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"この道は工事中なので、通り抜ける（　）。","options":["わけにはいかない","ほかはない","にちがいない","ことになっている"],"answer":0,"explanation_ja":"「〜わけにはいかない」は事情や規則からできないことを表します。","explanation_bn":"নিয়ম বা পরিস্থিতির কারণে করা সম্ভব নয়—「わけにはいかない」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"費用は参加人数（　）変わります。","options":["にともなって","に応じて","をめぐって","に先立って"],"answer":1,"explanation_ja":"「〜に応じて」は条件・程度に合わせて変化する意味です。人数に応じて費用が変わります。","explanation_bn":"「に応じて」 মানে অনুযায়ী; লোকসংখ্যা অনুযায়ী খরচ বদলায়।","reading":{},"type":"文法形式"},{"category":"文法","stem":"何度失敗した（　）、あきらめないつもりだ。","options":["ところで","としても","ばかりに","ものなら"],"answer":1,"explanation_ja":"「〜としても」は仮定しても結論は変わらないという意味です。","explanation_bn":"বারবার ব্যর্থ হলেও হাল ছাড়বে না—「としても」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"長い会議が終わった（　）、すぐに次の打ち合わせが始まった。","options":["かと思うと","からには","ばかりに","に限って"],"answer":0,"explanation_ja":"「〜かと思うと」はあることの直後に別のことが起きる様子です。","explanation_bn":"একটি ঘটনা শেষ হতেই আরেকটি ঘটল—「かと思うと」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"結果がどうなる（　）、まずは挑戦してみたい。","options":["にしても","につれて","にかけて","にひきかえ"],"answer":0,"explanation_ja":"「〜にしても」は結果に関係なくという譲歩を示します。","explanation_bn":"ফল যাই হোক চেষ্টা করতে চায়—「にしても」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"新しい制度を導入する（　）、社員への説明会を開いた。","options":["に先立って","にかかわらず","に反して","を通じて"],"answer":0,"explanation_ja":"「〜に先立って」はある行動より前にという意味です。","explanation_bn":"নতুন নিয়ম চালুর আগে সভা করা—「に先立って」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"十分な睡眠を取らない（　）、集中力が落ちてしまう。","options":["ことには","ものなら","ばかりか","にしては"],"answer":0,"explanation_ja":"「〜ないことには」はその条件が満たされないと望ましい結果にならない意味です。","explanation_bn":"পর্যাপ্ত ঘুম না হলে মনোযোগ থাকে না—「ないことには」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"締め切りまであと一日しかない。今さら延期する（　）。","options":["わけにはいかない","ほかならない","ものではない","にすぎない"],"answer":0,"explanation_ja":"「〜わけにはいかない」は責任や事情から許されないことを表します。","explanation_bn":"দায়িত্বের কারণে সময়সীমা পিছানো যায় না—「わけにはいかない」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"使い方を間違えると、便利な道具（　）危険になることがある。","options":["だけあって","でさえ","を問わず","に限って"],"answer":1,"explanation_ja":"「〜でさえ」は意外な例を強調します。便利な道具でさえ危険になるという意味です。","explanation_bn":"এমনকি উপকারী যন্ত্রও বিপজ্জনক হতে পারে—「でさえ」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"彼の説明は専門用語（　）で、初心者には理解しにくかった。","options":["だらけ","きり","ずくめ","のみ"],"answer":0,"explanation_ja":"「〜だらけ」は好ましくないものが多い様子です。「専門用語だらけ」は専門用語ばかりの意味です。","explanation_bn":"「だらけ」 মানে কোনো কিছুতে ভরা; এখানে কঠিন পরিভাষায় ভরা।","reading":{},"type":"文法形式"},{"category":"文法","stem":"この資料は外部に公開しない（　）になっている。","options":["こと","ところ","はず","もの"],"answer":0,"explanation_ja":"「〜ことになっている」は規則や決定事項を表します。","explanation_bn":"নিয়ম অনুযায়ী বাইরে প্রকাশ করা যাবে না—「ことになっている」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"予定より早く終わった（　）、追加の作業を頼まれた。","options":["ところ","あげく","ばかりに","に際して"],"answer":0,"explanation_ja":"「〜たところ」はある行動の結果や直後に分かったことを述べます。","explanation_bn":"কাজ তাড়াতাড়ি শেষ করার পর আরও কাজ দেওয়া হলো—「たところ」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"工事の進み具合（　）、引き渡しの日程を調整する。","options":["をもとに","に比べて","に先立ち","と反して"],"answer":0,"explanation_ja":"「〜をもとに」は判断の基礎にするという意味です。","explanation_bn":"কাজের অগ্রগতিকে ভিত্তি করে সময় ঠিক করা—「をもとに」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"この説明書は初心者にも理解できる（　）、図を多く使っている。","options":["ように","そうに","ためで","からに"],"answer":0,"explanation_ja":"「〜ように」は目標とする状態を表します。理解できるように図を使います。","explanation_bn":"শুরুকারীরাও যাতে বুঝতে পারে, সেই উদ্দেশ্যে 「ように」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"早く帰れる（　）、急いで作業を終わらせた。","options":["ものなら","ように","ばかりに","のみならず"],"answer":1,"explanation_ja":"「〜ように」は目的を表します。早く帰れるように作業を終えました。","explanation_bn":"তাড়াতাড়ি বাড়ি যেতে পারার জন্য 「ように」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"その店は休日（　）、平日も多くの客でにぎわっている。","options":["どころか","ばかりか","に限って","としたら"],"answer":1,"explanation_ja":"「〜ばかりか」は「〜だけでなく、さらに」の意味です。","explanation_bn":"শুধু ছুটির দিন নয়, কর্মদিবসেও ভিড়—「ばかりか」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"仕事が終わった（　）、今日は早く帰って休みたい。","options":["ことだし","ものなら","ところを","わけだが"],"answer":0,"explanation_ja":"「〜ことだし」は理由の一つを挙げて提案・意向につなげます。","explanation_bn":"কাজ শেষ হয়েছে, তাই বিশ্রাম নিতে চায়—「ことだし」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"彼が責任者である（　）、最終判断は彼に任せよう。","options":["以上","ばかり","ところ","最中"],"answer":0,"explanation_ja":"「〜以上」はそういう立場だから当然という意味です。","explanation_bn":"যেহেতু তিনি দায়িত্বে আছেন, সিদ্ধান্তও তাঁকে দেওয়া হবে—「以上」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"雨がひどいので、今日の屋外作業は中止せざる（　）。","options":["を得ない","に限らない","のほかない","べきではない"],"answer":0,"explanation_ja":"「〜ざるを得ない」は望まなくてもそうする必要があるという意味です。","explanation_bn":"ইচ্ছা না থাকলেও বন্ধ করতে বাধ্য—「ざるを得ない」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"参加する（　）しない（　）、今日中に返事をしてください。","options":["にしろ／にしろ","つつ／つつ","から／から","ほど／ほど"],"answer":0,"explanation_ja":"「〜にしろ〜にしろ」はどちらの場合でもという意味です。","explanation_bn":"অংশ নিক বা না নিক, দুই ক্ষেত্রেই উত্তর দিতে হবে—「にしろ」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"いくら説明しても彼は納得しない。（　）、実物を見せることにした。","options":["そこで","ただし","それでも","一方"],"answer":0,"explanation_ja":"「そこで」は前の事情を受けて対策・行動を述べる接続詞です。","explanation_bn":"বোঝাতে না পারায় পরবর্তী পদক্ষেপ নেওয়া হলো—「そこで」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"小さな変更（　）、事前に担当者に伝えてください。","options":["であっても","に比べて","に向けて","を通じて"],"answer":0,"explanation_ja":"「〜であっても」は条件が小さくても例外ではないことを示します。","explanation_bn":"ছোট পরিবর্তন হলেও জানাতে হবে—「であっても」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"彼女はその知らせを聞く（　）、急いで家を出た。","options":["なり","どころか","からには","ところを"],"answer":0,"explanation_ja":"「〜なり」は動作の直後を表します。知らせを聞いてすぐ出た意味です。","explanation_bn":"খবর শুনেই বেরিয়ে পড়ল—「なり」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"専門家の意見を聞いた（　）、最終的には自分で判断する。","options":["うえで","おかげで","せいで","そばから"],"answer":0,"explanation_ja":"「〜たうえで」は先に必要な行動を行ってから次へ進むことです。","explanation_bn":"বিশেষজ্ঞের মত শোনার পর নিজে সিদ্ধান্ত নেওয়া—「たうえで」。","reading":{},"type":"文法形式"},{"category":"文法","stem":"当日の天候（　）、イベントの会場を変更する場合があります。","options":["によっては","に限って","に先立ち","にかけて"],"answer":0,"explanation_ja":"「〜によっては」は条件によって異なる場合がある意味です。","explanation_bn":"আবহাওয়ার ওপর নির্ভর করে স্থান বদলাতে পারে—「によっては」。","reading":{},"type":"文法形式"},{"category":"読解","stem":"【短文：案内文】\n市民会館では、来月から会議室の予約方法が変わる。これまでは窓口だけで申し込めたが、今後はインターネットでも予約できる。ただし、利用料金の支払いは当日、窓口で行う必要がある。\n\n【質問】新しい予約方法について正しいものはどれですか。","options":["インターネットで予約と支払いの両方ができる","予約は窓口だけで受け付ける","ネットでも予約できるが支払いは窓口で行う","当日の予約は禁止される"],"answer":2,"explanation_ja":"ネット予約が可能になる一方、支払いは当日窓口で行います。","explanation_bn":"অনলাইনে বুকিং করা যাবে, তবে মূল্য অনুষ্ঠানের দিন কাউন্টারে দিতে হবে।","reading":{},"type":"短文"},{"category":"読解","stem":"【短文：意見文】\n失敗を減らすには、一度決めた方法を守ることが大切だ。しかし、状況が変わったのに以前の方法にこだわり続ければ、かえって問題が大きくなる。手順を守ることと、必要に応じて見直すことは両立できる。\n\n【質問】筆者が最も言いたいことは何ですか。","options":["決めた手順は絶対に変更すべきでない","状況に応じて手順を見直すことも必要だ","失敗は方法を変更すれば必ずなくなる","手順を決めることには意味がない"],"answer":1,"explanation_ja":"筆者は手順を守ることと、状況に応じた見直しの両方が必要だと述べています。","explanation_bn":"নিয়ম মেনে চলার পাশাপাশি পরিস্থিতি অনুযায়ী পরিবর্তন করাও জরুরি।","reading":{},"type":"短文"},{"category":"読解","stem":"【短文：掲示】\n図書室の利用時間は平日9時〜18時。ただし、水曜日は設備点検のため16時に閉室する。土曜日は10時〜15時で、日曜日と祝日は休み。返却ボックスは休室日も利用できる。\n\n【質問】正しいものはどれですか。","options":["日曜日も図書室で本を読める","水曜日は18時まで開いている","休室日も返却ボックスを使える","土曜日は9時から開く"],"answer":2,"explanation_ja":"最後の文で「返却ボックスは休室日も利用できる」と書かれています。","explanation_bn":"বন্ধের দিনেও বই ফেরত দেওয়ার বাক্স ব্যবহার করা যায়।","reading":{},"type":"短文"},{"category":"読解","stem":"【短文：生活】\n最近は健康のために歩く人が増えている。しかし、急に長い距離を歩くと体を痛めることもある。まずは普段より少し多く歩くことから始め、慣れてきたら距離を伸ばすとよい。\n\n【質問】筆者は何を勧めていますか。","options":["最初から長距離を歩く","歩くことを完全にやめる","短い距離から徐々に増やす","毎日同じ距離しか歩かない"],"answer":2,"explanation_ja":"「少し多く歩くことから始め、慣れたら距離を伸ばす」が根拠です。","explanation_bn":"অল্প দূরত্ব দিয়ে শুরু করে ধীরে ধীরে বাড়াতে বলা হয়েছে।","reading":{},"type":"短文"},{"category":"読解","stem":"【中文：研修案内】\n会社では新入社員向けの研修を計画している。従来は講師の説明を聞く時間が中心だったが、今年は少人数で意見を交換する活動を増やすことにした。担当者によると、知識を覚えるだけでなく、同僚に自分の考えを伝えたり、相手の意見を理解したりする力も必要だからだ。一方で、基本知識を学ぶ講義も引き続き行う。\n\n【質問】今年の研修で重視することは何ですか。","options":["講義をすべて廃止すること","知識だけを暗記すること","参加者同士の意見交換を増やすこと","講師の数を減らすこと"],"answer":2,"explanation_ja":"講義は残しつつ、少人数の意見交換を増やす方針です。","explanation_bn":"লেকচার থাকবে, তবে ছোট দলে মতবিনিময় বাড়ানো হবে।","reading":{},"type":"中文"},{"category":"読解","stem":"【中文：環境】\nある地域では、家庭から出るごみを減らすために、使い捨て容器の代わりに繰り返し使える容器を貸し出している。利用者は容器を洗って指定された店に返す。ただし、返却場所が少ないことが課題になっており、今後は参加店舗を増やす予定だ。担当者は、便利さを高めることが利用を広げる鍵になると考えている。\n\n【質問】現在の課題は何ですか。","options":["容器の値段が高すぎる","返却できる場所が少ない","容器を洗うことが禁止されている","参加店舗が多すぎる"],"answer":1,"explanation_ja":"本文で「返却場所が少ないことが課題」と明記されています。","explanation_bn":"মূল সমস্যা হলো পাত্র ফেরত দেওয়ার জায়গা কম।","reading":{},"type":"中文"},{"category":"読解","stem":"【中文：買い物】\nある店は、購入後30日以内なら未使用の商品を返品できる制度を導入した。ただし、食品や特注品は対象外で、返品の際にはレシートが必要だ。この制度を始めたことで購入に迷っていた人が利用しやすくなった一方、店員が返品条件を説明する時間も増えた。店では、条件を分かりやすく掲示する準備を進めている。\n\n【質問】店が今後行おうとしていることは何ですか。","options":["食品もすべて返品できるようにする","返品制度そのものを廃止する","返品条件を見やすく示す","レシートを不要にする"],"answer":2,"explanation_ja":"最後の文に「条件を分かりやすく掲示する」とあります。","explanation_bn":"ফেরত দেওয়ার শর্ত পরিষ্কারভাবে প্রদর্শন করবে।","reading":{},"type":"中文"},{"category":"読解","stem":"【情報検索：講座】\n【講座一覧】\nA：会話講座／火曜18:00〜19:00／初心者対象／無料\nB：文章講座／木曜18:30〜20:00／中級者対象／1,000円\nC：発音講座／土曜10:00〜11:00／中級者対象／無料\nD：読解講座／土曜14:00〜15:30／上級者対象／1,500円\n\nラフィさんは中級者で、平日は仕事があるため土曜日の午前しか参加できない。予算は500円以内だ。\n\n【質問】ラフィさんが参加できる講座はどれですか。","options":["A","B","C","D"],"answer":2,"explanation_ja":"土曜日午前・中級者・500円以内のすべてに合うのはCです。","explanation_bn":"শনিবার সকাল, মধ্যম স্তর ও ৫০০ ইয়েনের কম—শুধু C মেলে।","reading":{},"type":"情報検索"},{"category":"読解","stem":"【情報検索：施設】\n【体育館の予約案内】\n一般利用：9:00〜21:00／1時間800円\n学生利用：9:00〜18:00／1時間500円\n貸出用具：ボールは無料、ラケットは1回300円\n予約は利用日の7日前から前日まで。\n\n大学生のミナさんは、午後5時から1時間体育館を使い、ラケットも借りたい。\n\n【質問】必要な金額はいくらですか。","options":["500円","800円","1,100円","1,300円"],"answer":1,"explanation_ja":"学生料金500円＋ラケット300円＝800円です。","explanation_bn":"শিক্ষার্থী ফি ৫০০ ইয়েন + র‍্যাকেট ৩০০ ইয়েন = ৮০০ ইয়েন।","reading":{},"type":"情報検索"},{"category":"読解","stem":"【統合理解：交通】\nAさん：自転車は近距離の移動に便利で、運動にもなる。ただし、雨の日は使いにくい。\nBさん：公共交通機関は天気の影響を受けにくいが、混雑する時間帯には座れないこともある。\n\n【質問】二人の意見に共通することは何ですか。","options":["どちらも自転車が最善だと考えている","移動手段にはそれぞれ利点と欠点がある","公共交通機関は常に空いている","雨の日の移動は不可能だ"],"answer":1,"explanation_ja":"双方が異なる交通手段のメリットとデメリットを挙げています。","explanation_bn":"দুজনেই বিভিন্ন যাতায়াত ব্যবস্থার সুবিধা ও অসুবিধা বলেছেন।","reading":{},"type":"統合理解"},{"category":"読解","stem":"【主張理解：教育】\n新しいことを勉強するとき、間違いを恥ずかしがる人は少なくない。しかし、間違った理由を調べることで、自分が何を理解していないのか分かる。正解だけを覚えるよりも、考え方を見直すことが、次の問題に対応する力につながる。\n\n【質問】筆者の主張に最も近いものはどれですか。","options":["間違いはできるだけ隠すべきだ","正解を暗記するだけで十分だ","間違いの原因を理解することが重要だ","難しい問題には挑戦しないほうがよい"],"answer":2,"explanation_ja":"最後の二文が根拠。失敗を分析して考え方を改善する重要性を述べています。","explanation_bn":"ভুল কেন হয়েছে তা বোঝা ও চিন্তার পদ্ধতি সংশোধন করা জরুরি।","reading":{},"type":"主張理解"},{"category":"読解","stem":"【主張理解：仕事】\n仕事では速さが重視されることが多い。だが、急いだ結果ミスが増えてしまえば、修正にさらに時間がかかる。だからこそ、作業の初めに目的と手順を確かめることが、結果として最短の方法になる場合もある。\n\n【質問】筆者が伝えたいことは何ですか。","options":["確認を省けば必ず速く終わる","手順を確認することが効率につながる場合がある","仕事では速さを考える必要がない","ミスがあっても修正しなくてよい"],"answer":1,"explanation_ja":"冒頭の速さと対比して、事前確認がかえって効率につながると述べます。","explanation_bn":"শুরুতে কাজের ধাপ যাচাই করলে শেষ পর্যন্ত সময় বাঁচতে পারে।","reading":{},"type":"主張理解"}];

function enrich(s,active=true){const tokens=Object.keys(READINGS).sort((a,b)=>b.length-a.length);const re=new RegExp(tokens.join('|'),'g');return s.split('\n').map(line=>{if(!active)return esc(line);let out='',last=0;for(const m of line.matchAll(re)){out+=esc(line.slice(last,m.index));out+='<ruby>'+esc(m[0])+'<rt>'+esc(READINGS[m[0]])+'</rt></ruby>';last=m.index+m[0].length}return out+esc(line.slice(last))}).join('\n')}
function scrollToQuestion(){if(window.matchMedia('(max-width:760px)').matches){requestAnimationFrame(()=>{const el=document.querySelector('main.panel');if(el)window.scrollTo({top:Math.max(0,el.getBoundingClientRect().top+window.scrollY-72),behavior:'smooth'})})}}
function menu(){const modes=[['home','হোম / ホーム'],['漢字・語彙','কাঞ্জি・শব্দ / 漢字・語彙'],['文法','ব্যাকরণ / 文法'],['読解','পাঠ বোঝা / 読解'],['すべて','সব বিষয় / 総合問題'],['wrong','ভুল প্রশ্ন / 間違い直し']];$('menu').innerHTML=modes.map(([id,name])=>'<button class="menu-btn '+((state.mode===id||state.category===id&&state.mode==='quiz')?'active':'')+'" data-mode="'+esc(id)+'">'+esc(name)+'</button>').join('');document.querySelectorAll('[data-mobile]').forEach(b=>{const id=b.dataset.mobile;b.classList.toggle('active',state.mode===id||(state.mode==='quiz'&&state.category===id));b.onclick=()=>{if(id==='home'){state.mode='home';state.category='';render()}else if(id==='wrong')start('wrong');else start(id)}});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{const mode=b.dataset.mode;if(mode==='home'){state.mode='home';render()}else if(mode==='wrong')start('wrong');else start(mode)})}
function poolFor(cat){if(cat==='wrong')return QUESTIONS.map((q,i)=>i).filter(i=>history[i]&&history[i].wrong>0&&(!history[i].right||history[i].wrong>=history[i].right));return QUESTIONS.map((q,i)=>i).filter(i=>cat==='すべて'||QUESTIONS[i].category===cat)}
function randomize(arr){return [...arr].sort(()=>Math.random()-.5)}
function start(cat,size){const pool=randomize(poolFor(cat));if(!pool.length){state.mode='empty';state.category=cat;render();return}state={...state,mode:'quiz',category:cat,pool:pool.slice(0,size||Number($('count')?.value)||10),idx:0,answers:[],selection:null};render();scrollToQuestion()}
function scrollToExplanation(){
 if(!window.matchMedia('(max-width:760px)').matches)return;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  const el=document.querySelector('.answerbox');if(!el)return;
  const nav=document.getElementById('mobile-nav');
  const navHeight=nav?nav.getBoundingClientRect().height:64;
  /* Leave a bit of the answer choice visible above the solution for orientation. */
  const y=el.getBoundingClientRect().top+window.scrollY-navHeight-75;
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
 }));
}
function answer(n){if(state.answers[state.idx]!==undefined)return;state.answers[state.idx]=n;let id=state.pool[state.idx],correct=QUESTIONS[id].answer;history[id]??={right:0,wrong:0};history[id][n===correct?'right':'wrong']++;save();render();scrollToExplanation()}
function move(dir){state.idx+=dir;if(state.idx>=state.pool.length){state.mode='result'}else if(state.idx<0){state.idx=0}render();scrollToQuestion()}
function home(){const attempted=Object.values(history).filter(h=>(h.right||0)+(h.wrong||0)>0).length;const right=Object.values(history).reduce((a,h)=>a+(h.right||0),0);const wrong=Object.values(history).reduce((a,h)=>a+(h.wrong||0),0);let counts={};for(const q of QUESTIONS)counts[q.category]=(counts[q.category]||0)+1;$('app').innerHTML='<h2>আজকের অনুশীলন / 今日の学習</h2><p class="home-subtitle bn">প্রতিদিন ১০–২০টি প্রশ্ন অনুশীলন করুন। ভুল প্রশ্নগুলো আবার চেষ্টা করুন。</p><div class="grid home-grid"><div class="tile"><span>মোট প্রশ্ন / 収録</span><strong>'+QUESTIONS.length+'</strong></div><div class="tile"><span>চেষ্টা / 挑戦済み</span><strong>'+attempted+'</strong></div><div class="tile"><span>সঠিক / 正答率</span><strong>'+(right+wrong?Math.round(right/(right+wrong)*100):'—')+'%</strong></div></div><div class="divider"></div><h3>অনুশীলন শুরু করুন / 練習を始める</h3><div class="startbar"><div><label for="cat">বিষয় / 分野</label><select id="cat"><option value="すべて">সব বিষয় / 総合問題</option><option value="漢字・語彙">কাঞ্জি ও শব্দ / 漢字・語彙</option><option value="文法">ব্যাকরণ / 文法</option><option value="読解">পাঠ বোঝা / 読解</option><option value="wrong">ভুল প্রশ্ন / 間違い直し</option></select></div><div><label for="count">প্রশ্ন / 問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="999">全問</option></select></div><button class="primary" id="begin">শুরু করুন / 問題をスタート →</button></div><details class="home-warning"><summary>ℹ️ この問題集について / তথ্য</summary><div class="warning">এটি JLPT N2-এর প্রস্তুতির জন্য তৈরি মৌলিক প্রশ্নসংকলন। আসল পরীক্ষায় ফুরিগানা বা ব্যাখ্যা দেখানো হয় না। অনুশীলনে অভ্যস্ত হলে ফুরিগানা বন্ধ করুন। এই সংস্করণে শোনার পরীক্ষা নেই।<br>本教材は公式問題ではありません。慣れたらふりがなをOFFにしてください。聴解は未収録。履歴は端末・ブラウザごとに保存されます。</div></details><p class="muted home-info">বিষয়ভিত্তিক প্রশ্ন / 分野別：'+Object.entries(counts).map(([k,v])=>esc(k)+' '+v+'問').join(' ・ ')+'</p>';$('begin').onclick=()=>start($('cat').value,Number($('count').value))}
function quiz(){let qi=state.pool[state.idx],q=QUESTIONS[qi],selected=state.answers[state.idx],done=selected!==undefined,fur=$('furigana').checked;let stem=(q.noFuriganaStem||(q.category==='漢字・語彙'&&q.stem.includes('読み方')))?enrich(q.stem,false):enrich(q.stem,fur);let count=state.pool.length;let opts=q.options.map((t,i)=>'<button class="opt '+(done?(i===q.answer?'good':i===selected?'bad':''):'')+'" data-opt="'+i+'" '+(done?'disabled':'')+'>'+String(i+1)+'. '+esc(t)+'</button>').join('');const explanation=done?'<div class="answerbox" role="status" aria-live="polite"><strong>'+(selected===q.answer?'✅ সঠিক! / 正解です！':'❌ ভুল / 不正解です')+'　'+ 'সঠিক উত্তর / 正解：'+(q.answer+1)+'. '+esc(q.options[q.answer])+'</strong><div class="explainblock"><div class="explain-title">🇧🇩 বাংলায় ব্যাখ্যা / ベンガル語解説</div><p class="bn">'+esc(q.explanation_bn)+'</p></div><div class="explainblock"><div class="explain-title">🇯🇵 日本語の解説 / জাপানি ব্যাখ্যা</div><p>'+esc(q.explanation_ja)+'</p></div></div>':'';$('app').innerHTML='<div class="toolbar"><span class="pill">'+esc(q.category)+'</span><span class="muted">প্রশ্ন / 問題 '+(state.idx+1)+' / '+count+'</span></div><div class="progress"><div style="width:'+Math.round((state.idx+1)/count*100)+'%"></div></div><div class="stem">'+stem+'</div><div class="options">'+opts+'</div>'+explanation+'<div class="footerbtns"><button id="prev" '+(state.idx===0?'disabled':'')+'>আগের প্রশ্ন / 前へ</button><button class="primary" id="next" '+(!done?'disabled':'')+'>'+(state.idx===count-1?'ফলাফল / 結果を見る':'পরবর্তী / 次の問題')+'</button></div>';$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.opt)))}
function result(){const correct=state.pool.reduce((a,id,i)=>a+(state.answers[i]===QUESTIONS[id].answer?1:0),0);const mistakes=state.pool.filter((id,i)=>state.answers[i]!==QUESTIONS[id].answer);$('app').innerHTML='<h2>অনুশীলনের ফলাফল / 学習結果</h2><div class="grid"><div class="tile"><span>প্রশ্ন / 問題数</span><strong>'+state.pool.length+'</strong></div><div class="tile"><span>সঠিক / 正解</span><strong>'+correct+'</strong></div><div class="tile"><span>সঠিক হার / 正答率</span><strong>'+Math.round(correct/state.pool.length*100)+'%</strong></div></div><div class="divider"></div><p>'+ (correct===state.pool.length?'সবগুলো সঠিক! / 全問正解！':'ভুল প্রশ্নের ব্যাখ্যা পড়ে আবার চেষ্টা করুন。 / 間違えた問題を復習しましょう。')+'</p><div class="footerbtns"><button id="backhome">হোম / ホームに戻る</button><button class="primary" id="redo" '+(!mistakes.length?'disabled':'')+'>ভুলগুলো আবার / 間違い直し（'+mistakes.length+'問）</button></div>';$('backhome').onclick=()=>{state.mode='home';state.category='';render()};$('redo').onclick=()=>{state.pool=randomize(mistakes);state.idx=0;state.answers=[];state.mode='quiz';render();scrollToQuestion()}}
function render(){menu();if(state.mode==='home')home();else if(state.mode==='quiz')quiz();else if(state.mode==='result')result();else $('app').innerHTML='<h2>এখনও পুনরাবৃত্তির প্রশ্ন নেই / 復習問題はまだありません</h2><p>প্রথমে কিছু প্রশ্নের উত্তর দিন। / まず練習問題に挑戦してください。</p><button class="primary" id="backhome">হোম / ホームに戻る</button>',$('backhome').onclick=()=>{state.mode='home';state.category='';render()}}
$('furigana').onchange=()=>{$('furigana-mobile').checked=$('furigana').checked;if(state.mode==='quiz')render()};$('furigana-mobile').onchange=()=>{$('furigana').checked=$('furigana-mobile').checked;if(state.mode==='quiz')render()};$('reset-mobile').onclick=()=> $('reset').click();$('bengali').onchange=()=>{if(state.mode==='quiz')render()};$('reset').onclick=()=>{if(confirm('শেখার সব ইতিহাস মুছে ফেলবেন? / 学習履歴を削除しますか？')){history={};save();state.mode='home';state.category='';render()}};render();
</script></body></html>
